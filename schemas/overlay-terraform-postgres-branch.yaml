overlay: 1.1.0
x-speakeasy-jsonpath: rfc9535
info:
  title: Terraform generation overlay for planetscale_branch_postgres managed and data resources.
  version: 0.0.1
actions:
  - target: $.paths['/organizations/{organization}/databases/{database}/branches#postgres'].post
    description: Update operation metadata for PostgreSQL
    update:
      operationId: create_postgres_branch
      summary: Create a PostgreSQL branch
      x-speakeasy-entity-operation: PostgresBranch#create
      x-speakeasy-entity-description: Manage a PlanetScale PostgreSQL database branch.

  - target: $.paths['/organizations/{organization}/databases/{database}/branches#postgres'].post.requestBody.content['application/json'].schema.properties.seed_data
    description: Remove seed_data (Vitess-only field)
    remove: true

  - target: $.paths['/organizations/{organization}/databases/{database}/branches#postgres'].post.requestBody.content['application/json'].schema.properties['configuration_profile_sizes','router_sizes']
    description: Remove the Neki-only backup restore sizing inputs.
    remove: true

  - target: $.paths['/organizations/{organization}/databases/{database}/branches#postgres'].post.requestBody.content['application/json'].schema.properties.major_version
    description: Drop the upstream Neki mention; this resource is Postgres-only.
    update:
      description: The PostgreSQL major version to use for the branch. Defaults to the major version of the parent branch if it exists or the database's default branch major version. Ignored for branches restored from backups.

  - target: $.paths['/organizations/{organization}/databases/{database}/branches#postgres'].post.requestBody.content['application/json'].schema.properties['backup_id','restore_point']
    description: >-
      Treat backup restore inputs as create-only values. Terraform passes them
      to Create but does not persist them in plan or state, so later reads and
      imports do not attempt to reconcile restore provenance.
    update:
      x-speakeasy-terraform-write-only: true

  - target: $.paths['/organizations/{organization}/databases/{database}/branches#postgres'].post.requestBody.content['application/json'].schema.properties.cluster_size
    update:
      x-speakeasy-plan-validators: ClusterSizeValidator

  - target: $.paths['/organizations/{organization}/databases/{database}/branches#postgres'].post.requestBody.content['application/json'].schema.properties
    description: Restore PostgreSQL storage configuration after the shared branch overlay removes it.
    update:
      storage:
        type: object
        properties:
          minimum_storage_bytes:
            type: integer
            description: The minimum storage size in bytes.
          maximum_storage_bytes:
            type: integer
            description: The maximum storage size in bytes for autoscaling.

  - target: $.paths['/organizations/{organization}/databases/{database}/branches#postgres'].post.requestBody.content['application/json'].schema.properties
    description: Always send create_database_if_missing=true and kind=postgresql so the branch resource transparently creates the database when it does not already exist.
    update:
      create_database_if_missing:
        type: boolean
        const: true
        default: true
        description: Create the database if it does not already exist. The Terraform provider always sends this so that branch resources transparently provision the database on first apply.
        x-speakeasy-terraform-ignore: schema
      kind:
        type: string
        const: postgresql
        default: postgresql
        description: The kind of database. Always postgresql for planetscale_postgres_branch.
        x-speakeasy-terraform-ignore: schema

  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}#postgres'].post.responses['201'].content['application/json'].schema.properties
    description: Add Postgres response fields
    update:
      replicas:
        type: integer
        description: The number of replicas for the branch

  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}#postgres'].get
    description: Update operation metadata for PostgreSQL
    update:
      operationId: get_postgres_branch
      summary: Get a PostgreSQL branch
      x-speakeasy-entity-operation:
        - PostgresBranch#read
        - entityOperation: PostgresBranch#create#2
          options:
            polling:
              name: WaitForReady
      x-speakeasy-entity-description: Returns information about a PlanetScale PostgreSQL database branch.
      x-speakeasy-polling:
        - name: WaitForReady
          delaySeconds: 30
          intervalSeconds: 10
          limitCount: 4320 # 12 hours at a 10 second interval, plus initial 30 second delay
          successCriteria:
            - condition: $statusCode == 200
            - condition: $response.body#/state == "ready"

  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}#postgres'].get.responses['200'].content['application/json'].schema.properties
    description: >-
      Add a synthetic region slug populated from the nested API region object
      by a client hook so reads and imports refresh the configured region.
    update:
      region_slug:
        type: string
        x-speakeasy-name-override: region
        description: The region slug where the branch is hosted.
  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}#postgres'].get.responses['200'].content['application/json'].schema.required
    update:
      - region_slug


  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}#postgres'].get.responses['200'].content['application/json'].schema.properties
    description: Add Postgres response fields
    update:
      replicas:
        type: integer
        description: The number of replicas for the branch
      parameters:
        type: object
        nullable: true
        additionalProperties:
          type: object
          additionalProperties:
            type: string
        description: >-
          Postgres parameter overrides, nested by namespace (pgconf, pgbouncer,
          patroni), e.g. { pgconf = { max_connections = "200" } }. Omitted
          parameters are reset to their defaults.
      storage:
        type: object
        nullable: true
        properties:
          minimum_storage_bytes:
            type: integer
            nullable: true
            description: The minimum storage size in bytes.
          maximum_storage_bytes:
            type: integer
            nullable: true
            description: The maximum storage size in bytes for autoscaling.
          storage_autoscaling:
            type: boolean
            nullable: true
            description: Whether storage autoscaling is enabled.
          storage_iops:
            type: integer
            nullable: true
            description: The storage IOPS.
          storage_throughput_mibs:
            type: integer
            nullable: true
            description: The storage throughput in MiB/s.
        required:
          - minimum_storage_bytes
          - maximum_storage_bytes
          - storage_autoscaling
          - storage_iops
          - storage_throughput_mibs

  - target: $.paths['/organizations/{organization}/databases/{database}/branches#postgres'].post.responses['201'].content['application/json'].schema.properties['safe_migrations','vtgate_name','vtgate_count','vtgate_max_count','vtgate_autoscaling','vtgate_target_cpu_utilization']
    description: Remove Vitess-only branch settings
    remove: true
  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}#postgres'].get.responses['200'].content['application/json'].schema.properties['safe_migrations','vtgate_name','vtgate_count','vtgate_max_count','vtgate_autoscaling','vtgate_target_cpu_utilization']
    description: Remove Vitess-only branch settings
    remove: true
  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}#postgres'].patch.responses['200'].content['application/json'].schema.properties['safe_migrations','vtgate_name','vtgate_count','vtgate_max_count','vtgate_autoscaling','vtgate_target_cpu_utilization']
    description: Remove Vitess-only branch settings
    remove: true

  - target: $.paths['/organizations/{organization}/databases/{database}/branches#postgres'].post.responses['201'].content['application/json'].schema.properties.mysql_address
    remove: true
  - target: $.paths['/organizations/{organization}/databases/{database}/branches#postgres'].post.responses['201'].content['application/json'].schema.properties.mysql_edge_address
    remove: true
  - target: $.paths['/organizations/{organization}/databases/{database}/branches#postgres'].post.responses['201'].content['application/json'].schema.properties.keyspace_count
    description: Remove keyspace_count (Vitess-only field)
    remove: true
  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}#postgres'].get.responses['200'].content['application/json'].schema.properties.mysql_address
    remove: true
  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}#postgres'].get.responses['200'].content['application/json'].schema.properties.mysql_edge_address
    remove: true
  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}#postgres'].get.responses['200'].content['application/json'].schema.properties.keyspace_count
    description: Remove keyspace_count (Vitess-only field)
    remove: true
  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}#postgres'].patch.responses['200'].content['application/json'].schema.properties.mysql_address
    remove: true
  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}#postgres'].patch.responses['200'].content['application/json'].schema.properties.mysql_edge_address
    remove: true
  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}#postgres'].patch.responses['200'].content['application/json'].schema.properties.keyspace_count
    description: Remove keyspace_count (Vitess-only field)
    remove: true

  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}#postgres'].patch.parameters[?@.name == 'branch']
    description: Add x-speakeasy-match to branch parameter
    update:
      x-speakeasy-match: id

  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}#postgres'].patch.requestBody.content['application/json'].schema.properties.new_name
    description: Map new_name to name field from GET response
    update:
      x-speakeasy-name-override: name

  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}#postgres'].delete
    description: Update operation metadata for PostgreSQL
    update:
      operationId: delete_postgres_branch
      summary: Delete a PostgreSQL branch
      x-speakeasy-entity-operation: PostgresBranch#delete

  - target: $.paths["/organizations/{organization}/databases/{database}/branches/{branch}/changes/{id}"].get.parameters[?@.name == 'branch']
    description: Add x-speakeasy-match to branch parameter
    update:
      x-speakeasy-match: id

  - target: $.paths["/organizations/{organization}/databases/{database}/branches/{branch}/changes/{id}"].get.parameters[?@.name == 'id']
    description: Add x-speakeasy-match to id parameter
    update:
      x-speakeasy-name-override: change_request_id
      x-speakeasy-terraform-ignore: schema
  - target: $.paths["/organizations/{organization}/databases/{database}/branches/{branch}/changes/{id}"].get.responses['200'].content['application/json'].schema.properties.*
    description: Keep only id and state for branch change response
    remove: true
  - target: $.paths["/organizations/{organization}/databases/{database}/branches/{branch}/changes/{id}"].get.responses['200'].content['application/json'].schema.properties
    update:
      id:
        type: string
        x-speakeasy-name-override: change_request_id
        x-speakeasy-terraform-ignore: schema
      state:
        type: string
        x-speakeasy-name-override: change_request_state
        x-speakeasy-terraform-ignore: schema

  - target: $.paths["/organizations/{organization}/databases/{database}/branches/{branch}/changes/{id}"].get
    update:
      x-speakeasy-entity-operation:
        - entityOperation: PostgresBranch#create#4
          options:
            polling:
              name: WaitForChangeRequestComplete
        - entityOperation: PostgresBranch#update#3
          options:
            polling:
              name: WaitForChangeRequestComplete
      x-speakeasy-polling:
        - name: WaitForChangeRequestComplete
          delaySeconds: 30
          intervalSeconds: 10
          limitCount: 90 # 15 minutes at a 10 second interval, plus initial 30 second delay
          failureCriteria:
            - condition: $statusCode == 200
            - condition: $response.body#/change_request_state == "canceled"
          successCriteria:
            - condition: $statusCode == 200
            - condition: $response.body#/change_request_state == "completed"

  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}#postgres'].patch
    description: Update branch metadata
    update:
      operationId: update_postgres_branch
      summary: Update a PostgreSQL branch
      x-speakeasy-entity-operation: PostgresBranch#update

  - target: $.paths["/organizations/{organization}/databases/{database}/branches/{branch}/changes"].patch
    description: Apply declarative PostgreSQL branch changes through the public branch changes endpoint.
    update:
      operationId: apply_postgres_branch_changes
      summary: Apply a PostgreSQL branch's cluster size, parameters, and storage configuration
      x-speakeasy-entity-operation:
        - PostgresBranch#create#3
        - PostgresBranch#update#2

  - target: $.paths["/organizations/{organization}/databases/{database}/branches/{branch}/changes"].patch.parameters[?@.name == 'branch']
    update:
      x-speakeasy-match: id

  - target: $.paths["/organizations/{organization}/databases/{database}/branches/{branch}/changes"].patch.requestBody.content["application/json"].schema.properties['replicas','extensions']
    description: Keep settings that the PostgreSQL branch resource does not manage out of its schema.
    remove: true

  - target: $.paths["/organizations/{organization}/databases/{database}/branches/{branch}/changes"].patch.requestBody.content["application/json"].schema.properties.storage.properties.confirm_shrink
    description: confirm_shrink is an imperative operation rather than persistent Terraform configuration.
    remove: true

  - target: $.paths["/organizations/{organization}/databases/{database}/branches/{branch}/changes"].patch.requestBody.content["application/json"].schema.properties.parameters
    description: Use the typed declarative parameter map exposed by the PostgreSQL branch resource.
    remove: true
  - target: $.paths["/organizations/{organization}/databases/{database}/branches/{branch}/changes"].patch.requestBody.content["application/json"].schema.properties
    update:
      parameters:
        type: object
        nullable: true
        additionalProperties:
          type: object
          additionalProperties:
            type: string
        x-speakeasy-plan-modifiers: WarnOnRemovedParameters
        description: >-
          Postgres parameter overrides, nested by namespace (pgconf, pgbouncer,
          patroni), e.g. { pgconf = { max_connections = "200" } }. Omitted
          parameters are reset to their defaults.

  - target: $.paths["/organizations/{organization}/databases/{database}/branches/{branch}/changes"].patch.responses["200"].content["application/json"].schema.properties.*
    description: Keep only the fields needed to poll the resulting change request.
    remove: true
  - target: $.paths["/organizations/{organization}/databases/{database}/branches/{branch}/changes"].patch.responses["200"].content["application/json"].schema.properties
    update:
      id:
        type: string
        x-speakeasy-name-override: change_request_id
        x-speakeasy-terraform-ignore: schema
      state:
        type: string
        x-speakeasy-name-override: change_request_state
        x-speakeasy-terraform-ignore: schema
  - target: $.paths["/organizations/{organization}/databases/{database}/branches/{branch}/changes"].patch.responses["200"].content["application/json"].schema.required
    remove: true
  - target: $.paths["/organizations/{organization}/databases/{database}/branches/{branch}/changes"].patch.responses["200"].content["application/json"].schema
    update:
      required:
        - id
        - state
