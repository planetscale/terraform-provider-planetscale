overlay: 1.1.0
x-speakeasy-jsonpath: rfc9535
info:
  title: Terraform generation overlay for planetscale_branch_vitess managed and data resources.
  version: 0.0.1
actions:
  - target: $.paths['/organizations/{organization}/databases/{database}/branches#vitess'].post
    description: Update operation metadata for Vitess
    update:
      operationId: create_vitess_branch
      summary: Create a Vitess branch
      x-speakeasy-entity-operation: VitessBranch#create
      x-speakeasy-entity-description: Manage a PlanetScale Vitess database branch.

  - target: $.paths['/organizations/{organization}/databases/{database}/branches#vitess'].post.requestBody.content['application/json'].schema.properties.cluster_size
    update:
      x-speakeasy-plan-validators: VitessClusterSizeValidator

  - target: $.paths['/organizations/{organization}/databases/{database}/branches#vitess'].post.responses['201'].content['application/json'].schema.properties.vtgate_name
    description: Use the public VTGate SKU as the configurable VTGate size.
    update:
      x-speakeasy-name-override: vtgate_size
  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}#vitess'].get.responses['200'].content['application/json'].schema.properties.vtgate_name
    description: Use the public VTGate SKU as the configurable VTGate size.
    update:
      x-speakeasy-name-override: vtgate_size
  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}#vitess'].patch.responses['200'].content['application/json'].schema.properties.vtgate_name
    description: Use the public VTGate SKU as the configurable VTGate size.
    update:
      x-speakeasy-name-override: vtgate_size

  - target: $.paths['/organizations/{organization}/databases/{database}/branches#vitess'].post.requestBody.content['application/json'].schema.properties.restore_point
    description: Remove restore_point (Postgres-only field)
    remove: true
  - target: $.paths['/organizations/{organization}/databases/{database}/branches#vitess'].post.requestBody.content['application/json'].schema.properties.major_version
    description: Remove major_version (Postgres-only field)
    remove: true

  - target: $.paths['/organizations/{organization}/databases/{database}/branches#vitess'].post.requestBody.content['application/json'].schema.properties
    description: Add Vitess create-time fields and constants.
    update:
      create_database_if_missing:
        type: boolean
        const: true
        default: true
        description: Create the database if it does not already exist. The Terraform provider always sends this so that branch resources transparently provision the database on first apply.
        x-speakeasy-terraform-ignore: schema
      kind:
        type: string
        const: mysql
        default: mysql
        description: The kind of database. Always mysql for planetscale_vitess_branch.
        x-speakeasy-terraform-ignore: schema
      safe_migrations:
        type: boolean
        description: Whether safe migrations (DDL protection) are enabled.

  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}#vitess'].get
    description: Update operation metadata for Vitess
    update:
      operationId: get_vitess_branch
      summary: Get a Vitess branch
      x-speakeasy-entity-operation:
        - VitessBranch#read
        - entityOperation: VitessBranch#create#2
          options:
            polling:
              name: WaitForReady
      x-speakeasy-entity-description: Returns information about a PlanetScale Vitess database branch.
      x-speakeasy-polling:
        - name: WaitForReady
          delaySeconds: 30
          intervalSeconds: 10
          limitCount: 90 # 15 minutes at a 10 second interval, plus initial 30 second delay
          successCriteria:
            - condition: $statusCode == 200
            - condition: $response.body#/state == "ready"

  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}#vitess'].patch
    description: Update branch metadata
    update:
      operationId: update_vitess_branch
      summary: Update a Vitess branch
      x-speakeasy-entity-operation: VitessBranch#update#4

  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}#vitess'].patch.parameters[?@.name == 'branch']
    description: Add x-speakeasy-match to branch parameter
    update:
      x-speakeasy-match: id

  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}#vitess'].patch.requestBody.content['application/json'].schema.properties.new_name
    description: Map new_name to name field from GET response
    update:
      x-speakeasy-name-override: name

  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}/safe-migrations'].put
    description: Apply safe migrations after the branch is ready and during in-place updates.
    update:
      x-speakeasy-entity-operation:
        - VitessBranch#create#3
        - VitessBranch#update#3
      requestBody:
        required: true

  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}/safe-migrations'].put.parameters[?@.name == 'branch']
    description: Match the safe migrations operation to the branch public ID.
    update:
      x-speakeasy-match: id

  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}/safe-migrations'].put.responses['200'].content
    description: Use the branch read operation as the source of Terraform state.
    remove: true

  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}/resizes'].put
    description: Apply VTGate settings after the branch is ready and during in-place updates.
    update:
      x-speakeasy-entity-operation:
        - VitessBranch#create#4
        - VitessBranch#update
      requestBody:
        required: true

  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}/resizes'].put.parameters[?@.name == 'branch']
    description: Match the resize operation to the branch public ID.
    update:
      x-speakeasy-match: id

  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}/resizes'].put.responses['200'].content['application/json'].schema.properties.*
    description: Keep only the resize request ID needed by the polling operation.
    remove: true

  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}/resizes'].put.responses['200'].content['application/json'].schema.properties
    update:
      id:
        type: string
        x-speakeasy-name-override: resize_request_id
        x-speakeasy-terraform-ignore: schema

  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}/resizes/{resize}'].get.parameters[?@.name == 'branch']
    description: Match the resize polling operation to the branch public ID.
    update:
      x-speakeasy-match: id

  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}/resizes/{resize}'].get.parameters[?@.name == 'resize']
    description: Match the polling path parameter to the resize request ID.
    update:
      x-speakeasy-name-override: resize_request_id
      x-speakeasy-terraform-ignore: schema

  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}/resizes/{resize}'].get.responses['200'].content['application/json'].schema.properties.*
    description: Keep only the fields needed to poll the resize request.
    remove: true

  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}/resizes/{resize}'].get.responses['200'].content['application/json'].schema.properties
    update:
      id:
        type: string
        x-speakeasy-name-override: resize_request_id
        x-speakeasy-terraform-ignore: schema
      state:
        type: string
        x-speakeasy-name-override: resize_request_state
        x-speakeasy-terraform-ignore: schema

  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}/resizes/{resize}'].get
    description: Poll the exact resize request after applying VTGate settings.
    update:
      x-speakeasy-entity-operation:
        - entityOperation: VitessBranch#create#5
          options:
            polling:
              name: WaitForResizeComplete
        - entityOperation: VitessBranch#update#2
          options:
            polling:
              name: WaitForResizeComplete
      x-speakeasy-polling:
        - name: WaitForResizeComplete
          delaySeconds: 0
          intervalSeconds: 10
          limitCount: 90
          failureCriteria:
            - condition: $statusCode == 200
            - condition: $response.body#/resize_request_state == "canceled"
          successCriteria:
            - condition: $statusCode == 200
            - condition: $response.body#/resize_request_state == "completed"

  - target: $.paths['/organizations/{organization}/databases/{database}/branches/{branch}#vitess'].delete
    description: Update operation metadata for Vitess
    update:
      operationId: delete_vitess_branch
      summary: Delete a Vitess branch
      x-speakeasy-entity-operation: VitessBranch#delete
